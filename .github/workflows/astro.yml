# Build the Astro site in site/ and publish it to the gh-pages branch.
#
# Why a branch and not actions/deploy-pages: Pages deployments made through
# actions/deploy-pages sat in GitHub's queue until they timed out on this repo
# (an open GitHub-side problem: https://github.com/actions/deploy-pages/issues/406),
# while branch-based Pages builds deploy normally. So the build happens here and
# GitHub Pages serves the gh-pages branch.
#
# Repository setting: Settings -> Pages -> Build and deployment ->
#   Source: "Deploy from a branch", Branch: gh-pages, Folder: / (root)
name: Deploy Astro site to Pages

on:
  push:
    branches: ["main0"]
  workflow_dispatch:

permissions:
  contents: write # push the built site to gh-pages

# One deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "site" # the Astro project
  PAGES_BRANCH: "gh-pages"

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build with Astro
        # site and base (https://sumo048.github.io + /CS-pi_site) come from astro.config.ts
        run: |
          npx --no-install astro check
          npx --no-install astro build
        working-directory: ${{ env.BUILD_PATH }}
      - name: Publish to the gh-pages branch
        working-directory: ${{ env.BUILD_PATH }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll   # serve files as-is; Jekyll would drop the _astro/ folder
          git init -q -b "$PAGES_BRANCH"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Commit on top of the current gh-pages (if it exists) so unchanged media
          # are stored once and nothing is force-pushed. --soft keeps the freshly
          # built files as the working tree; `add -A` then records any removals.
          if git fetch -q --depth=1 origin "$PAGES_BRANCH"; then
            git reset -q --soft FETCH_HEAD
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${PAGES_BRANCH}"
          echo "Published ${GITHUB_SHA::7} to ${PAGES_BRANCH}."
